name: Reproducibility check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Reconstruct and authenticate frozen DOE
        run: python scripts/reconstruct_master100_doe.py

      - name: Validate principal reported claims
        run: python scripts/validate_results.py
